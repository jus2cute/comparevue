<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Logo -->
  <rect x="80" y="60" width="80" height="80" rx="20" fill="url(#accent)"/>
  <text x="120" y="116" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="36" fill="#1e40af">CV</text>

  <text x="180" y="116" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="40" fill="white">CompareVue</text>

  <!-- Tagline -->
  <text x="80" y="440" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="64" fill="white">Smart SaaS Comparisons</text>
  <text x="80" y="510" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="32" fill="#93c5fd">Find the right tools — without the guesswork.</text>

  <!-- Footer bar -->
  <rect x="0" y="570" width="1200" height="60" fill="rgba(0,0,0,0.15)"/>
  <text x="1200" y="608" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" fill="#93c5fd" opacity="0.7">comparevue.com</text>
